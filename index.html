<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hook Master - YourName's Updates</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .hook-container {
      text-align: center;
      background: white;
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 { color: #333; margin-bottom: 1rem; }
    p { color: #666; font-size: 1.1rem; }
    .clickable {
      cursor: pointer;
      transition: transform 0.3s;
    }
    .clickable:hover { transform: scale(1.1); }
  </style>
</head>
<body>
  <div class="hook-container">
    <h1>🎣 Hook Master</h1>
    <p>Click the image below to get hooked!</p>
    
    <!-- Your clickable image element -->
    <img 
      src="https://yourname.site/icon.png" 
      alt="Hook Image" 
      class="clickable"
      id="hookImage"
      width="200"
      height="200"
    />
    
    <p style="margin-top: 1rem; font-size: 0.9rem;">
      (Notification permission will be requested on first click)
    </p>
  </div>

  <!-- Include your hook-master.js -->
  <script src="hook-master.js"></script>
</body>
</html>
